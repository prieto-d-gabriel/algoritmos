<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Nota</title>
<script src="functions.js"> </script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .card {
            border-radius: 15px;
        }

        .titulo {
            color: #0d6efd;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">
                    <div class="card-body">

                        <h2 class="text-center titulo mb-4">Registro de Nota</h2>

                        <form id="formNota">

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del estudiante</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ingrese el nombre" required>
                            </div>

                            <!-- Curso -->
                            <div class="mb-3">
                                <label for="curso" class="form-label">Curso</label>
                                <input type="text" class="form-control" id="curso" placeholder="Ingrese el curso" required>
                            </div>

                            <!-- Nota -->
                            <div class="mb-3">
                                <label for="nota" class="form-label">Nota</label>
                                <input type="number" class="form-control" id="nota" min="0" max="20" placeholder="Ingrese la nota" required>
                            </div>

                            <!-- Botón -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Guardar Nota
                                </button>
                            </div>

                        </form>

                        <!-- Resultado -->
                        <div class="mt-4" id="resultado"></div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("formNota").addEventListener("submit", function(event) {
            event.preventDefault();

            let nombre = document.getElementById("nombre").value;
            let curso = document.getElementById("curso").value;
            let nota = parseFloat(document.getElementById("nota").value);

            let estado = "";

            if (nota >= 11) {
                estado = "Aprobado";
            } else {
                estado = "Desaprobado";
            }

            document.getElementById("resultado").innerHTML = `
                <div class="alert alert-info">
                    <strong>Estudiante:</strong> ${nombre} <br>
                    <strong>Curso:</strong> ${curso} <br>
                    <strong>Nota:</strong> ${nota} <br>
                    <strong>Estado:</strong> ${estado}
                </div>
            `;
        });
    </script>

</body>
</html>
